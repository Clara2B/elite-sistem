<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Elite Sistem{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% import "_icones.html" as icones %}
  <div class="app-shell">
    <aside class="sidebar">
      <div class="marca"><span class="ponto"></span> ELITE SISTEM</div>
      <nav class="menu">
        {% for item in menu %}
          <a href="{{ item.url }}" class="{{ 'ativo' if request.url.path.startswith(item.url) else '' }}">
            {{ icones.icone(item.icone) }}
            <span class="rotulo">{{ item.rotulo }}</span>
          </a>
        {% endfor %}
      </nav>
      <div class="usuario-area">
        <div class="nome">{{ usuario.nome }}</div>
        <form method="post" action="/logout">
          <button type="submit" class="sair">{{ icones.icone('sair') }} Sair</button>
        </form>
      </div>
    </aside>
    <div class="conteudo-area">
      <main>
        {% block conteudo %}{% endblock %}
      </main>
    </div>
  </div>
</body>
</html>
